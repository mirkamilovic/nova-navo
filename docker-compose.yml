services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data

  # Ixtiyoriy: 50 MB chegarasini 2 GB gacha oshirish uchun local Bot API.
  # Yoqish uchun: https://my.telegram.org dan API_ID/API_HASH oling, bu blokni
  # izohdan chiqaring va .env ga BOT_API_URL=http://telegram-bot-api:8081 yozing.
  # (Bot va server bir xil /data hajmini ko'rishi kerak.)
